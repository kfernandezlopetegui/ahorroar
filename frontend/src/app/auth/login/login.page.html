<ion-content class="ion-padding">
  <div class="auth-wrap">

    <h1 class="auth-title">AhorroAR</h1>
    <p class="auth-sub">Descuentos y promociones en un solo lugar</p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <ion-item class="input-item" lines="none">
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" formControlName="email" autocomplete="email" />
      </ion-item>

      <ion-item class="input-item" lines="none">
        <ion-label position="stacked">Contraseña</ion-label>
        <ion-input type="password" formControlName="password" autocomplete="current-password" />
      </ion-item>

      @if (errorMsg()) {
        <p class="field-error">{{ errorMsg() }}</p>
      }

      <ion-button
        expand="block"
        type="submit"
        class="auth-submit"
        [disabled]="loading() || form.invalid">
        @if (loading()) {
          <ion-spinner name="crescent" />
        } @else {
          Ingresar
        }
      </ion-button>

    </form>

    <p class="auth-switch">
      ¿No tenés cuenta?
      <a routerLink="/auth/register">Registrate</a>
    </p>

  </div>
</ion-content>
